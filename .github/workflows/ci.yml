# Calls the TypeScript checks of thatsnotmynameio/github-actions#39 on each
# pull request, as a scratch run before the ruleset requires them.
name: ci

on:
  pull_request:

permissions: {}

jobs:
  typescript:
    uses: thatsnotmynameio/github-actions/.github/workflows/typescript.yml@e66ca2293b3c3958f2995845941ce71ac713b590 # worktree-typescript
    permissions:
      contents: read
      security-events: write
