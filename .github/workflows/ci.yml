# Calls the TypeScript checks of thatsnotmynameio/github-actions#39 on each
# pull request, as a scratch run before the ruleset requires them.
name: ci

on:
  pull_request:

permissions: {}

jobs:
  typescript:
    uses: thatsnotmynameio/github-actions/.github/workflows/typescript.yml@6ce9bb963bf940041123f0d412641d6dd466ef57 # worktree-typescript
    permissions:
      contents: read
      security-events: write
